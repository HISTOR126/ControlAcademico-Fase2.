name: Compilación y pruebas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ControlAcademico.slnx --configuration Release
      - run: dotnet run --project tests/ControlAcademico.Pruebas --configuration Release --no-build
      - run: dotnet run --project tests/ControlAcademico.Integracion --configuration Release --no-build
      - run: python3 tests/verificar_web.py
