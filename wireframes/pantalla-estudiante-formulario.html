<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario de estudiante</title><style>body{margin:0;font-family:Arial;background:#f2f2f2;color:#333}main{max-width:1000px;margin:24px auto;padding:24px;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}label{display:block;margin:16px 0}input,select{display:block;padding:8px;max-width:400px;width:90%}button{padding:10px;background:#4a2f7a;color:white;border:0}a{color:#4a2f7a}</style></head><body><nav aria-label="Pantallas del prototipo" style="width:auto;padding:12px;background:#4a2f7a;color:white;display:flex;gap:16px;flex-wrap:wrap"><a style="color:white" href="index.html">Índice</a><a style="color:white" href="pantalla-principal-dashboard.html">Dashboard</a><a style="color:white" href="pantalla-estudiantes-listado.html">Estudiantes</a><a style="color:white" href="pantalla-estudiante-formulario.html">Formulario</a><a style="color:white" href="pantalla-detalle-curso.html">Detalle</a><a style="color:white" href="pantalla-matriculas.html">Matrículas</a><a style="color:white" href="pantalla-calificaciones.html">Notas</a></nav><p style="margin:12px;color:#555">Boceto de interfaz: datos de ejemplo, sin guardar cambios ni conectar con C#.</p><main><h1>Formulario de estudiante</h1><form onsubmit="event.preventDefault();document.getElementById('mensaje').textContent='Demostración: no se guardaron datos.';"><label>Carnet<input name="carnet" type="text" required></label><label>Nombres<input name="nombres" type="text" required></label><label>Apellidos<input name="apellidos" type="text" required></label><label>Correo<input name="correo" type="email" required></label><label>Teléfono<input name="telefono" type="tel" required></label><label>Fecha de nacimiento<input name="fecha" type="date" required></label><label>Carrera<input name="carrera" type="text" required></label><label>Facultad<input name="facultad" type="text" required></label><button type="submit">Guardar (demostración)</button><p id="mensaje" role="status"></p></form></main></body></html>
